name: app_multiusos
description: Aplicación multiusos para tareas universitarias.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  audioplayers: ^6.0.0
  url_launcher: ^6.1.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/mi_foto.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/mi_foto.jpg
    - assets/toolbox.png